<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid;
            border-image-source: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            border-image-slice: 1;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-input:focus {
            border-color: #d7baff;
            box-shadow: 0 0 10px rgba(189, 147, 249, 0.2);
            outline: none;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
        }
        
        .glow-purple-blob {
            background: radial-gradient(circle, #bd93f9 0%, transparent 70%);
            width: 600px;
            height: 600px;
            top: -100px;
            left: -100px;
        }
        
        .glow-gold-blob {
            background: radial-gradient(circle, #ffdb3c 0%, transparent 70%);
            width: 500px;
            height: 500px;
            bottom: -50px;
            right: -100px;
        }
    </style>
</head>
<body class="bg-void-black text-on-surface min-h-screen flex flex-col relative overflow-hidden font-body-md">
<!-- Ambient Background -->
<div class="ambient-glow glow-purple-blob"></div>
<div class="ambient-glow glow-gold-blob"></div>
<!-- No Navigation as this is a transactional Login page -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10 w-full max-w-container-max mx-auto">
<!-- Login Card -->
<div class="glass-panel w-full max-w-md p-glass-padding rounded-xl relative overflow-hidden">
<!-- Card Highlight -->
<div class="absolute top-0 left-0 w-32 h-32 bg-gradient-to-br from-white/10 to-transparent pointer-events-none rounded-tl-xl"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-8">
<img alt="Escuela Bíblica Filadelfia Logo" class="w-32 h-32 object-contain mb-4 filter drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTedZb6kZrjUDG3pOmm5lveFgNfZ-V40NMh3fgGsAWVxu4H_h_hzCRetjBJbZUnCJD1cfhrAmUkUQze9Aj1DZTo6ON9hblFrjP45rmQcsW6D3b88nZEvZViXhVCOThoQI9yaJcGPfzwAFv-kfyqtuiSKMFR3rlOcTXm8p80YZcCEP5B18kbPB15LCuxq_5HVPYoHK8IDF3m8Bc-thv9YNv_4-0Zkewo_hbZ4rTLPUSUJexcSYTBZE"/>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight text-center">Aula Virtual</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Acceso a la plataforma educativa</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Role Selector -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase" for="role">Perfil de Acceso</label>
<div class="relative">
<select class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-on-surface appearance-none focus:ring-1 focus:ring-primary transition-all duration-300" id="role" name="role">
<option class="bg-surface-container text-on-surface" value="estudiantes">Estudiantes</option>
<option class="bg-surface-container text-on-surface" value="docentes">Docentes</option>
<option class="bg-surface-container text-on-surface" value="secretaria">Secretaria</option>
<option class="bg-surface-container text-on-surface" value="director">Director</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Username -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase" for="username">Usuario / Matrícula</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</div>
<input class="glass-input w-full rounded-lg pl-12 pr-4 py-3 font-body-md text-on-surface placeholder-on-surface-variant/50 transition-all duration-300" id="username" name="username" placeholder="Ej: 2024-001" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="glass-input w-full rounded-lg pl-12 pr-12 py-3 font-body-md text-on-surface placeholder-on-surface-variant/50 transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off" id="toggle-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-8 bg-primary/40 backdrop-blur-[10px] border-t border-white/20 text-on-surface font-label-md text-label-md py-4 rounded-lg flex justify-center items-center gap-2 hover:bg-primary/50 hover:shadow-[0_0_20px_rgba(189,147,249,0.3)] transition-all duration-300 group" type="submit">
<span>Entrar al Aula</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Extra Links -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿No tienes cuenta? <a class="text-tertiary hover:text-glow-gold hover:underline transition-all" href="#">Solicitar acceso</a>
</p>
</div>
</div>
</main>
<!-- Footer - Excluded to maintain focus on the transaction -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
                toggleIcon.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
                toggleIcon.setAttribute('data-icon', 'visibility_off');
            }
        }
    </script>
</body></html>
